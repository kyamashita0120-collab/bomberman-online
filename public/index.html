<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1 class="title">ARCADE ONLINE</h1>
    <div id="game-label" style="font-size:14px;color:#ffa502;letter-spacing:2px;min-height:18px;"></div>

    <div id="game-wrap">
      <canvas id="canvas"></canvas>

      <div id="overlay">
        <div id="overlay-content">
          <div id="phase-lobby">
            <h2>ロビー</h2>
            <div id="lobby-game-label" style="color:#ffa502;font-size:15px;margin-bottom:8px;"></div>
            <div id="lobby-status">接続中...</div>
            <div id="player-slots"></div>
            <button id="ready-btn" onclick="toggleReady()">準備OK</button>
            <p class="hint" id="ready-hint">全員が準備OKでゲーム開始</p>
            <a href="/sprite-editor.html" target="_blank" class="editor-link">✏️ スプライト編集</a>
          </div>
          <div id="phase-countdown" style="display:none">
            <div id="countdown-num"></div>
            <p>準備してください</p>
          </div>
          <div id="phase-over" style="display:none">
            <div id="winner-text"></div>
            <div id="next-game-label" style="color:#aaa;font-size:14px;margin-bottom:16px;"></div>
            <p style="color:#666;font-size:13px;margin-bottom:16px;">4秒後にロビーへ戻ります</p>
            <button onclick="location.reload()">最初からやり直す</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hud"></div>

    <div id="controls">
      <span>移動: ↑↓←→ / WASD</span>
      <span>ボム/射撃: スペース / Z</span>
      <span>テトリス: ↑回転 ↓落下 Space確定</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
